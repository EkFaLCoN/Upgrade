name: Eklentileri Derle

# Depoya (kok klasore) istedigin kadar eklenti .zip'i yukle:
#   ClassAndRegion.zip, KozmetikSistemi.zip ...
# Her zip ayri ayri acilir, icindeki Maven projesi derlenir ve her biri icin
# ayri bir jar "Artifacts" bolumune yuklenir.
# Bu dosyanin yeri: .github/workflows/derle.yml

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      zipler: ${{ steps.bul.outputs.zipler }}
    steps:
      - uses: actions/checkout@v4
      - name: Kokteki zip dosyalarini bul
        id: bul
        run: |
          LISTE=$(ls *.zip 2>/dev/null | jq -R -s -c 'split("\n") | map(select(length>0))')
          if [ "$LISTE" = "[]" ] || [ -z "$LISTE" ]; then
            echo "::error::Depoda .zip dosyasi bulunamadi."
            exit 1
          fi
          echo "Bulunan zipler: $LISTE"
          echo "zipler=$LISTE" >> "$GITHUB_OUTPUT"

  derle:
    needs: liste
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zip: ${{ fromJson(needs.liste.outputs.zipler) }}
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: "${{ matrix.zip }} dosyasini ac"
        run: |
          rm -rf _kaynak
          unzip -q "${{ matrix.zip }}" -d _kaynak
          # Zip icinde tek bir kok klasor varsa onun icine gir
          ADET=$(ls _kaynak | wc -l)
          KOK=$(ls _kaynak | head -1)
          if [ "$ADET" -eq 1 ] && [ -d "_kaynak/$KOK" ]; then
            echo "PROJE=_kaynak/$KOK" >> "$GITHUB_ENV"
          else
            echo "PROJE=_kaynak" >> "$GITHUB_ENV"
          fi

      - name: pom.xml kontrolu
        run: |
          echo "Proje klasoru: $PROJE"
          ls -la "$PROJE"
          if [ ! -f "$PROJE/pom.xml" ]; then
            echo "::error::$PROJE icinde pom.xml bulunamadi. Zip icindeki klasor yapisini kontrol et."
            exit 1
          fi

      - name: Java 25 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '_kaynak/**/pom.xml'

      - name: Surumleri dogrula
        run: |
          java -version
          mvn -v
          SURUM=$(java -version 2>&1 | head -1 | sed -E 's/.*"([0-9]+).*/\1/')
          if [ "$SURUM" -lt 25 ]; then
            echo "::error::Maven JDK $SURUM ile calisiyor, Paper 26.2 icin JDK 25 gerekiyor."
            exit 1
          fi

      - name: Maven ile derle
        run: mvn -B -f "$PROJE/pom.xml" clean package

      - name: Jar adini belirle
        id: ad
        run: |
          echo "ad=$(basename '${{ matrix.zip }}' .zip)" >> "$GITHUB_OUTPUT"

      - name: Jar dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ad.outputs.ad }}
          path: ${{ env.PROJE }}/target/*.jar
          if-no-files-found: error
